name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/qul-data-starter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/qul-data-starter/package-lock.json
      - run: npm ci
      - run: npm test

  python:
    name: Python feedback triage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/oss-feedback-triage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

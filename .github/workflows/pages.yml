name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build static portfolio artifact
        run: |
          mkdir -p _site/quran-resource-explorer
          cp docs/index.html _site/index.html
          cp projects/quran-resource-explorer/index.html _site/quran-resource-explorer/index.html
          cp projects/quran-resource-explorer/styles.css _site/quran-resource-explorer/styles.css
          cp projects/quran-resource-explorer/catalog.js _site/quran-resource-explorer/catalog.js
          cp projects/quran-resource-explorer/app.js _site/quran-resource-explorer/app.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
